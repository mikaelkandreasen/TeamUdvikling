# Stack til Dockhand / docker compose. Henter det færdigbyggede image fra GitHub (bygges automatisk af GitHub Actions).
# Lokal bygning (uden Dockhand): docker compose -f compose.yaml -f compose.build.yaml up --build
# Variabler sættes i Dockhand (eller i .env ved lokal brug – se .env.example). Alle har fornuftige standardværdier.
# Appen kører på port 1020 på serveren (U11_PORT).
services:
  u11:
    image: ${U11_IMAGE:-ghcr.io/mikaelkandreasen/u11-udvikling:latest}   # fast version: U11_IMAGE=ghcr.io/mikaelkandreasen/u11-udvikling:0.2.3
    container_name: u11-udvikling
    restart: unless-stopped
    environment:
      TZ: Europe/Copenhagen
      # Sæt en fast, lang tilfældig nøgle (python3 -c "import secrets;print(secrets.token_hex(32))").
      # Tom = appen genererer og gemmer en nøgle i /data/secret_key.
      SECRET_KEY: ${SECRET_KEY:-}
      # 1 når siden kun nås via HTTPS (reverse proxy). Skal være 0 ved ren http på LAN.
      COOKIE_SECURE: ${COOKIE_SECURE:-0}
      # Valgfri engangskode, der kræves for at oprette første administrator.
      # Tom = appen laver selv en engangskode (se container-loggen / /data/setup_token).
      SETUP_TOKEN: ${SETUP_TOKEN:-}
      # Antal reverse proxies foran appen (typisk 1). Giver ægte klient-IP til login-spærre. 0 = ingen proxy.
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-0}
      # Dage en enhed kan huskes uden kode/2FA (0 = slået fra).
      REMEMBER_DAYS: ${REMEMBER_DAYS:-30}
      # E-mail til nulstilling af adgangskode/2FA (valgfrit). PUBLIC_URL = adressen brugerne bruger, fx https://teamudvikling.saem.dk
      PUBLIC_URL: ${PUBLIC_URL:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURITY: ${SMTP_SECURITY:-starttls}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      # 2FA-krypteringsnøgle. Tom = /data/totp_key. Flyt den hertil ved at kopiere INDHOLDET af /data/totp_key (en anden nøgle gør alles 2FA ugyldig!),
      # gem den også et sikkert sted uden for backupperne, og slet derefter filen.
      TOTP_KEY: ${TOTP_KEY:-}
      # 1 = nye adgangskoder tjekkes mod kendte datalæk (Have I Been Pwned; kun de første 5 tegn af en hash sendes). Fejl/ingen net = tjekket springes over.
      PWNED_CHECK: ${PWNED_CHECK:-1}
      # 1 når backupperne kopieres krypteret til et andet sted (fjerner påmindelsen i Administration).
      BACKUP_OFFSITE: ${BACKUP_OFFSITE:-0}
    volumes:
      - u11-data:/data          # database + automatiske backups (/data/backups)
    ports:
      - "${U11_BIND:-0.0.0.0}:${U11_PORT:-1020}:8000"   # U11_BIND=127.0.0.1 hvis reverse proxy kører på samme maskine
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 200
    mem_limit: 512m

volumes:
  u11-data:
