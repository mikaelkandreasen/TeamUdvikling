name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - name: Tag skal matche VERSION
        if: startsWith(github.ref, 'refs/tags/v')
        run: test "v$(cat VERSION)" = "${GITHUB_REF_NAME}"

  security:
    runs-on: ubuntu-latest
    continue-on-error: true      # advarer, men blokerer ikke udgivelse af imaget
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install pip-audit bandit
      - run: pip-audit -r requirements.txt
      - run: bandit -q -r app -ll

  smoke:
    # Bygger imaget og starter det som i drift (ikke-root, cap_drop ALL, skrivebeskyttet rod) – fanger Dockerfile-fejl før udgivelse
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t u11-smoke --build-arg VERSION="$(cat VERSION)" .
      - name: Start og kontrollér
        run: |
          docker volume create u11-smoke-data
          docker run -d --name u11-smoke -p 8000:8000 --cap-drop ALL --read-only --tmpfs /tmp \
            -v u11-smoke-data:/data -e U11_DATA_DIR=/data u11-smoke
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:8000/healthz && break; sleep 2; done
          curl -fs http://127.0.0.1:8000/healthz
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/setup); test "$code" = "200"
          test "$(docker exec u11-smoke id -u)" != "0"
          docker exec u11-smoke python -c "import PIL, qrcode; print('pakker ok')"
      - if: failure()
        run: docker logs u11-smoke || true

  image:
    needs: [test, smoke]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/u11-udvikling
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=edge,branch=main
      - id: ver
        run: echo "v=$(cat VERSION)" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.ver.outputs.v }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
