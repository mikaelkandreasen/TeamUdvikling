{% extends "base.html" %}{% block title %}Vælg ny adgangskode{% endblock %}
{% block content %}
<div class="login card">
  <h1>Vælg ny adgangskode</h1>
  <p>Din adgangskode er midlertidig. Vælg en ny, før du fortsætter.</p>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>Ny adgangskode (mindst 12 tegn)</label><input type="password" name="new" autocomplete="new-password" required autofocus>
    <label>Gentag</label><input type="password" name="new2" autocomplete="new-password" required>
    <div class="actions"><button class="btn block">Gem</button></div>
  </form>
</div>
{% endblock %}
