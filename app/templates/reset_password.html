{% extends "base.html" %}{% block title %}Ny adgangskode{% endblock %}
{% block content %}
<div class="login card">
  <h1>Vælg ny adgangskode</h1>
  <p>En administrator har godkendt nulstillingen. Din 2FA-kode skal stadig bruges ved login.</p>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label for="n1">Ny adgangskode (mindst 12 tegn)</label><input id="n1" type="password" name="new" autocomplete="new-password" required autofocus>
    <label for="n2">Gentag</label><input id="n2" type="password" name="new2" autocomplete="new-password" required>
    <div class="actions"><button class="btn block">Gem ny adgangskode</button></div>
  </form>
</div>
{% endblock %}
