{% extends "base.html" %}{% from "_macros.html" import csrf with context %}{% block title %}{{ _("Runder") }}{% endblock %}
{% block content %}
<h1>{{ _("Evalueringsrunder – {team}", team=team['name']) }}</h1>
<form method="post" class="card">{{ csrf() }}
  {% for i in infos %}<div class="row"><div><label>{{ _("Runde {i} – navn", i=i['no']) }}</label><input type="text" name="label_{{ i['no'] }}" value="{{ i['label'] }}" maxlength="60"></div>
  <div><label>{{ _("Dato") }}</label><input type="date" name="date_{{ i['no'] }}" value="{{ i['date'] }}"></div></div>{% endfor %}
  <div class="actions"><button class="btn">{{ _("Gem") }}</button></div></form>
{% endblock %}
